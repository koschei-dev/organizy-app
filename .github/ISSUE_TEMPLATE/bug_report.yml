name: Bug report
description: Something didn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please don't paste real file names or file contents you'd rather keep private. Describe them instead (for example "a PDF bank statement").
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Chose a folder with ...
        2. Pressed Scan
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Organizy version
      description: Organizy menu → About Organizy
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.4"
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: Was Local AI on?
      options:
        - "No"
        - "Yes, when rules aren't sure"
        - "Yes, for every file"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots help. Blur anything private.
